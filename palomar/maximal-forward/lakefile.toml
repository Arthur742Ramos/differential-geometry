name = "PalomarMaximalForward"
version = "0.1.0"
keywords = ["mathematics", "maximal-flow", "gluing"]
defaultTargets = ["PalomarMaximalForward", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "PalomarMaximalForward"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
